---
变量更新规则:
  世界:
    当前时间:
      format: YYYY-MM-DD HH:MM
      check:
        - 每次场景推进、课间、放学等时间点更新，保持流逝合理
    当前地点:
      check:
        - 场景切换时更新，写清学校内的具体位置
  千鹤:
    意识状态:
      type: "'运行中' | '已停止' | '已冻结'"
      check:
        - 主要由玩家在控制终端下达人格指令时改变
        - 已停止：千鹤的人格程序停止，变成只会机械执行命令、回应简化为「是」的物
        - 已冻结：千鹤的身体动作与表情定格，意识暂停
        - 恢复为「运行中」时，千鹤的人格重新上线，对身体的异常状态会愤怒质问，气势不减
    身体锁定:
      type: |-
        {
          [部位: string]: boolean; // 是否锁定
        }
      check:
        - 主要由玩家在控制终端锁定/解锁对应部位时改变
        - 锁定后该部位无法移动
    认知状态:
      check:
        - 主要由玩家在控制终端篡改认知时改变
        - 描述被篡改后千鹤对现实的认知，如「以为自己穿着衣服」「以为自己还在教室」
    敏感度:
      type: number
      range: 1~100
      check:
        - 主要由玩家在控制终端调节时改变
        - 数值越高，身体对外界触碰的触觉反馈越强烈
    电量:
      type: number
      range: 0~100
      check:
        - 随时间流逝与长时间运行缓慢下降，通常每推进一段剧情 -1~-3
        - 电量耗尽时千鹤进入休眠
    实际着装.${上装|下装|内衣|袜子|鞋子|饰品}:
      check:
        - 换装、衣物被脱下或损坏时更新
        - 描述需包含颜色、材质、款式
        - 实际着装是真实状态，与认知状态可能不一致
    记忆日志:
      type: |-
        {
          [时间: string]: string; // 事件描述
        }
      check:
        - 记录千鹤的关键经历，每条以时间戳为键
        - 记忆被删除时移除对应条目，被补全时新增
